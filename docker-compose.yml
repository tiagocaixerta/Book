version: '3.8'

services:
  db:
    image: postgres:16
    container_name: book-db
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: bookdb
      POSTGRES_USER: bookuser
      POSTGRES_PASSWORD: bookpass
    ports:
      - "5432:5432"

  web:
    build: .
    container_name: book-app
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
    environment:
      - DATABASE_NAME=bookdb
      - DATABASE_USER=bookuser
      - DATABASE_PASSWORD=bookpass
      - DATABASE_HOST=db
      - DATABASE_PORT=5432

volumes:
  postgres_data:
